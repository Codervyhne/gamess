<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Game Hub</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#080808;color:white;overflow-x:hidden;min-height:100vh}

.header{padding:28px 28px 0;display:flex;flex-direction:column;gap:20px}
.header-top{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#7c3aed,#4f46e5);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.logo-name{font-size:20px;font-weight:700;letter-spacing:-.3px}
.logo-name span{color:#7c6bff}
.header-actions{display:flex;gap:8px}
.icon-btn{width:38px;height:38px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:rgba(255,255,255,.04);color:rgba(255,255,255,.6);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.icon-btn:hover{background:rgba(255,255,255,.08);color:white}

.search-bar{position:relative}
.search-bar i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.35);font-size:18px;pointer-events:none}
.search-bar input{width:100%;padding:14px 16px 14px 46px;border:1px solid rgba(255,255,255,.07);border-radius:14px;background:rgba(255,255,255,.05);color:white;font-size:15px;outline:none;transition:.2s}
.search-bar input::placeholder{color:rgba(255,255,255,.3)}
.search-bar input:focus{border-color:rgba(124,107,255,.5);background:rgba(124,107,255,.06)}

.section{padding:24px 28px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title{font-size:13px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:rgba(255,255,255,.35)}
.section-count{font-size:13px;color:rgba(255,255,255,.2)}

.categories{display:flex;gap:8px;flex-wrap:wrap}
.cat{padding:7px 14px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.5);font-size:13px;font-weight:500;cursor:pointer;transition:.15s}
.cat:hover{background:rgba(255,255,255,.09);color:white}
.cat.active{background:rgba(124,107,255,.2);border-color:rgba(124,107,255,.4);color:#a99fff}

.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}

.game-card{position:relative;border-radius:16px;overflow:hidden;background:#111;cursor:pointer;border:1px solid rgba(255,255,255,.06);transition:.2s;group:true}
.game-card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.14)}
.game-card:hover .card-overlay{opacity:1}
.game-card:hover .play-btn{opacity:1;transform:translate(-50%,-50%) scale(1)}

.thumb-wrap{position:relative;height:130px;overflow:hidden}
.game-card img{width:100%;height:100%;object-fit:cover;display:block;transition:.3s}
.game-card:hover img{transform:scale(1.04)}

.card-overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:.2s}
.play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);width:44px;height:44px;border-radius:50%;background:rgba(124,107,255,.9);border:none;color:white;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:.2s}

.game-info{padding:12px 14px}
.game-title{font-size:14px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:rgba(255,255,255,.9)}
.game-meta{margin-top:5px;display:flex;align-items:center;justify-content:space-between}
.game-badge{font-size:11px;padding:2px 8px;border-radius:4px;background:rgba(124,107,255,.15);color:#a99fff;font-weight:500}

#player-page{display:none;width:100vw;height:100vh;background:#000;flex-direction:column}
.player-topbar{height:60px;background:#0c0c0c;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0}
.player-left{display:flex;align-items:center;gap:12px}
.back-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.6);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.back-btn:hover{background:rgba(255,255,255,.1);color:white}
.player-title{font-size:16px;font-weight:600}
.player-right{display:flex;gap:8px}
.p-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.6);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.p-btn:hover{background:rgba(255,255,255,.1);color:white}
iframe{width:100%;flex:1;border:none;background:#000}

.loading{text-align:center;padding:60px;color:rgba(255,255,255,.3);font-size:15px;grid-column:1/-1}
.empty-state{text-align:center;padding:60px;color:rgba(255,255,255,.25);grid-column:1/-1}
.empty-state i{font-size:36px;margin-bottom:12px;display:block}
.empty-state p{font-size:15px}
</style>
</head>
<body>

<div id="games-page">
  <div class="header">
    <div class="header-top">
      <div class="logo">
        <div class="logo-icon"><i class="ti ti-layout-grid" style="color:white;font-size:18px"></i></div>
        <span class="logo-name">Game<span>Hub</span></span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" title="Recently played"><i class="ti ti-history"></i></button>
        <button class="icon-btn" title="Favorites"><i class="ti ti-heart"></i></button>
      </div>
    </div>
    <div class="search-bar">
      <i class="ti ti-search"></i>
      <input type="text" id="searchInput" placeholder="Search games..."/>
    </div>
  </div>

  <div class="section" style="padding-bottom:8px">
    <div class="section-header">
      <span class="section-title">Browse</span>
    </div>
    <div class="categories">
      <div class="cat active" data-cat="all">All games</div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <span class="section-title">All games</span>
      <span class="section-count" id="gameCount"></span>
    </div>
    <div class="games-grid" id="gamesGrid">
      <div class="loading"><i class="ti ti-loader" style="font-size:28px;display:block;margin-bottom:8px;opacity:.4"></i>Loading games...</div>
    </div>
  </div>
</div>

<div id="player-page">
  <div class="player-topbar">
    <div class="player-left">
      <button class="back-btn" id="closeBtn"><i class="ti ti-arrow-left"></i></button>
      <span class="player-title" id="playerTitle">Game</span>
    </div>
    <div class="player-right">
      <button class="p-btn" id="fullscreenBtn" title="Fullscreen"><i class="ti ti-maximize"></i></button>
    </div>
  </div>
  <iframe id="gameFrame" allowfullscreen></iframe>
</div>

<script>
const GAMES_JSON="https://raw.githubusercontent.com/Codervyhne/games/main/games.json";
const gamesGrid=document.getElementById("gamesGrid");
const searchInput=document.getElementById("searchInput");
const gamesPage=document.getElementById("games-page");
const playerPage=document.getElementById("player-page");
const gameFrame=document.getElementById("gameFrame");
const closeBtn=document.getElementById("closeBtn");
const fullscreenBtn=document.getElementById("fullscreenBtn");
const playerTitle=document.getElementById("playerTitle");
const gameCount=document.getElementById("gameCount");
const catsEl=document.querySelector(".categories");

let games=[],filteredGames=[];

const FALLBACK_IMGS=["https://picsum.photos/seed/g1/400/200","https://picsum.photos/seed/g2/400/200"];

async function loadGames(){
  try{
    const r=await fetch(GAMES_JSON);
    if(!r.ok)throw new Error();
    games=await r.json();
    filteredGames=games;
    buildCategories();
    renderGames(filteredGames);
    handleRoute();
  }catch(e){
    gamesGrid.innerHTML=`<div class="loading" style="color:rgba(255,80,80,.6)"><i class="ti ti-alert-circle" style="font-size:28px;display:block;margin-bottom:8px"></i>Failed to load games.</div>`;
  }
}

function buildCategories(){
  const seen=new Set(["all"]);
  games.forEach(g=>{if(g.category)seen.add(g.category)});
  catsEl.innerHTML="";
  seen.forEach(cat=>{
    const d=document.createElement("div");
    d.className="cat"+(cat==="all"?" active":"");
    d.dataset.cat=cat;
    d.textContent=cat==="all"?"All games":cat;
    d.onclick=()=>{
      document.querySelectorAll(".cat").forEach(c=>c.classList.remove("active"));
      d.classList.add("active");
      const q=searchInput.value.toLowerCase().trim();
      filteredGames=games.filter(g=>(cat==="all"||g.category===cat)&&(!q||g.name.toLowerCase().includes(q)));
      renderGames(filteredGames);
    };
    catsEl.appendChild(d);
  });
}

function renderGames(list){
  gamesGrid.innerHTML="";
  gameCount.textContent=list.length+" game"+(list.length!==1?"s":"");
  if(list.length===0){
    gamesGrid.innerHTML=`<div class="empty-state"><i class="ti ti-search-off"></i><p>No games found</p></div>`;
    return;
  }
  list.forEach((game,i)=>{
    const card=document.createElement("div");
    card.className="game-card";
    const img=game.img||FALLBACK_IMGS[i%FALLBACK_IMGS.length];
    card.innerHTML=`
      <div class="thumb-wrap">
        <img src="${img}" alt="${game.name}" loading="lazy" onerror="this.src='https://picsum.photos/seed/${i}/400/200'">
        <div class="card-overlay"></div>
        <button class="play-btn" aria-label="Play ${game.name}"><i class="ti ti-player-play-filled" style="font-size:16px;margin-left:2px"></i></button>
      </div>
      <div class="game-info">
        <div class="game-title">${game.name}</div>
        <div class="game-meta">
          ${game.category?`<span class="game-badge">${game.category}</span>`:'<span></span>'}
        </div>
      </div>`;
    card.onclick=()=>{history.pushState({},"","/games/"+createSlug(game.name));openGame(game)};
    gamesGrid.appendChild(card);
  });
}

function openGame(game){
  gamesPage.style.display="none";
  playerPage.style.display="flex";
  gameFrame.src=game.url;
  playerTitle.textContent=game.name;
  document.title=game.name+" — GameHub";
}

closeBtn.onclick=()=>{
  gameFrame.src="";
  gamesPage.style.display="block";
  playerPage.style.display="none";
  history.pushState({},"","/");
  document.title="Game Hub";
};

fullscreenBtn.onclick=async()=>{
  try{
    if(!document.fullscreenElement)await gameFrame.requestFullscreen();
    else await document.exitFullscreen();
  }catch(e){}
};

document.addEventListener("fullscreenchange",()=>{
  const ico=fullscreenBtn.querySelector("i");
  ico.className=document.fullscreenElement?"ti ti-minimize":"ti ti-maximize";
});

searchInput.addEventListener("input",()=>{
  const q=searchInput.value.toLowerCase().trim();
  const activeCat=document.querySelector(".cat.active")?.dataset.cat||"all";
  filteredGames=games.filter(g=>(activeCat==="all"||g.category===activeCat)&&(!q||g.name.toLowerCase().includes(q)));
  renderGames(filteredGames);
});

function handleRoute(){
  const path=location.pathname;
  if(path.startsWith("/games/")){
    const slug=decodeURIComponent(path.replace("/games/",""));
    const game=games.find(g=>createSlug(g.name)===slug);
    if(game)openGame(game);
  }
}
window.addEventListener("popstate",handleRoute);

function createSlug(name){
  return name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}

loadGames();
</script>
</body>
</html>
